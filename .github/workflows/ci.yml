name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Run benchmark harness tests
        working-directory: ${{ github.workspace }}/bench
        run: pytest . -v

  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check punctuation
        shell: python
        run: |
          import subprocess
          import sys

          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split()

          hits = []
          for path in tracked:
              try:
                  lines = open(path, encoding="utf-8").read().splitlines()
              except (OSError, UnicodeDecodeError):
                  continue
              for number, line in enumerate(lines, 1):
                  if "\u2014" in line:
                      hits.append(f"{path}:{number}: {line.strip()}")

          if hits:
              print("\n".join(hits))
              print("\nUse a colon, comma, or hyphen instead.")
              sys.exit(1)

          print(f"checked {len(tracked)} files, clean")
