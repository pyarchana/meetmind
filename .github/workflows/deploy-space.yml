name: deploy space

# Pushes the app to a Hugging Face Space. Inert until HF_TOKEN (secret) and
# HF_SPACE (variable) are set, so it exits green rather than sitting red while
# you decide whether to use it. See huggingface/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check for credentials
        id: creds
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE missing, nothing to deploy."
            echo "See huggingface/README.md to enable this."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The Space root is the contents of app/, so app/Dockerfile lands at the
      # root where Spaces looks for it. Tests and dev requirements are dropped:
      # they are not needed to serve and only slow the build.
      - name: Stage the space
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/space"
          cp -r app/. "$RUNNER_TEMP/space/"
          rm -rf "$RUNNER_TEMP/space/tests" \
                 "$RUNNER_TEMP/space/pytest.ini" \
                 "$RUNNER_TEMP/space/requirements-dev.txt" \
                 "$RUNNER_TEMP/space/.pytest_cache"
          find "$RUNNER_TEMP/space" -name __pycache__ -type d -prune -exec rm -rf {} +
          cp huggingface/space-readme.md "$RUNNER_TEMP/space/README.md"
          echo "staged:"
          ls "$RUNNER_TEMP/space"

      - name: Push to the space
        if: steps.creds.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd "$RUNNER_TEMP/space"
          git init -q -b main
          git config user.email "deploy@meetmind.local"
          git config user.name "meetmind deploy"
          git add -A
          git commit -q -m "sync from ${GITHUB_SHA::7}"
          # The token goes in via a header rather than the URL, so it cannot
          # end up in a remote listing or an error message.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'user:%s' "$HF_TOKEN" | base64 -w0)" \
              push --force "https://huggingface.co/spaces/$HF_SPACE" main
